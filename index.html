<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Energy Clicker</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans JP', sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
        }
        .font-orbitron {
            font-family: 'Orbitron', sans-serif;
        }
        /* ネオンアニメーション & エフェクト */
        .neon-text-blue {
            text-shadow: 0 0 5px #00f0ff, 0 0 10px #00f0ff, 0 0 20px #00f0ff;
        }
        .neon-box-blue {
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
            border: 1px solid rgba(0, 240, 255, 0.5);
        }
        .core-btn {
            transition: transform 0.05s ease, box-shadow 0.1s ease;
        }
        .core-btn:active {
            transform: scale(0.92);
        }
        /* ポップアップテキストアニメーション */
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-50px) scale(1.2); }
        }
        .click-pop {
            position: absolute;
            pointer-events: none;
            animation: floatUp 0.8s ease-out forwards;
            font-weight: bold;
            font-family: 'Orbitron', sans-serif;
            color: #00f0ff;
            text-shadow: 0 0 5px #000;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-cyan-500 selection:text-black">

    <!-- Header Navigation -->
    <header class="border-b border-gray-800 bg-gray-900/80 backdrop-blur sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <i class="fa-solid font-orbitron fa-atom text-cyan-400 text-2xl animate-spin" style="animation-duration: 10s;"></i>
                <h1 class="text-xl font-black font-orbitron tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500">
                    CYBER ENERGY
                </h1>
            </div>

            <!-- Auth Status / Login Buttons -->
            <div id="auth-container" class="flex items-center gap-3">
                <div id="loading-spinner" class="text-gray-400 text-sm">
                    <i class="fas fa-spinner fa-spin mr-1"></i> 接続中...
                </div>
                <button id="login-btn" class="hidden bg-white text-gray-900 hover:bg-gray-100 font-bold px-4 py-2 rounded-lg text-sm transition flex items-center gap-2 shadow-lg hover:shadow-cyan-500/20">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-4 h-4" alt="Google">
                    Googleでログイン
                </button>
                <div id="user-profile" class="hidden flex items-center gap-3">
                    <img id="user-avatar" class="w-8 h-8 rounded-full border border-cyan-400" src="" alt="User Avatar">
                    <div class="hidden sm:block text-left">
                        <div id="user-name" class="text-xs font-bold text-gray-200">User</div>
                        <button id="edit-name-btn" class="text-[10px] text-cyan-400 hover:underline">名前を変更</button>
                    </div>
                    <button id="logout-btn" class="bg-gray-800 hover:bg-gray-700 text-gray-300 px-3 py-1.5 rounded-md text-xs transition border border-gray-700">
                        ログアウト
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="max-w-6xl mx-auto px-4 py-6 w-full flex-grow grid grid-cols-1 lg:grid-cols-12 gap-6">

        <!-- Left Panel: Clicker Game Section (7 cols) -->
        <section class="lg:col-span-7 flex flex-col gap-6">
            
            <!-- Energy Display Card -->
            <div class="bg-gray-900/60 rounded-2xl p-6 border border-gray-800 neon-box-blue flex flex-col items-center justify-center text-center relative overflow-hidden">
                <div class="text-xs uppercase tracking-widest text-gray-400 font-orbitron mb-1">現在の所持エナジー</div>
                <div id="energy-count" class="text-4xl sm:text-5xl font-extrabold font-orbitron text-cyan-400 neon-text-blue my-2">0</div>
                <div class="text-xs text-gray-400 flex gap-4">
                    <span>毎秒生産: <strong id="eps-display" class="text-cyan-300 font-orbitron">0</strong> /s</span>
                    <span>累計獲得: <strong id="total-energy-display" class="text-gray-300 font-orbitron">0</strong></span>
                </div>
            </div>

            <!-- Clicker Core Interactive Area -->
            <div class="bg-gray-900/40 rounded-2xl p-8 border border-gray-800/80 flex flex-col items-center justify-center relative min-h-[300px] select-none" id="click-area">
                <button id="core-button" class="core-btn w-44 h-44 rounded-full bg-gradient-to-tr from-cyan-600 via-blue-600 to-indigo-500 p-1 flex items-center justify-center shadow-2xl shadow-cyan-500/40 focus:outline-none">
                    <div class="w-full h-full rounded-full bg-gray-950 flex flex-col items-center justify-center border border-cyan-400/50 hover:bg-gray-900 transition">
                        <i class="fa-solid fa-bolt text-5xl text-cyan-400 drop-shadow-[0_0_10px_rgba(0,240,255,0.8)]"></i>
                        <span class="text-xs font-orbitron text-cyan-300 mt-2 font-bold tracking-wider">TAP HERE</span>
                    </div>
                </button>
            </div>

            <!-- Upgrade Shop -->
            <div class="bg-gray-900/60 rounded-2xl p-5 border border-gray-800">
                <h3 class="text-sm font-bold font-orbitron text-cyan-400 mb-4 flex items-center gap-2">
                    <i class="fa-solid fa-microchip"></i> アップグレードショップ
                </h3>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    
                    <!-- Click Upgrade Button -->
                    <button id="upgrade-click-btn" class="p-3 bg-gray-800 hover:bg-gray-750 disabled:opacity-40 disabled:hover:bg-gray-800 rounded-xl border border-gray-700 text-left transition flex items-center justify-between group">
                        <div>
                            <div class="text-xs font-bold text-gray-200">パワー・タップ</div>
                            <div class="text-[11px] text-gray-400">クリック +1</div>
                            <div class="text-xs font-orbitron text-cyan-400 mt-1">コスト: <span id="click-cost">10</span></div>
                        </div>
                        <div class="bg-gray-900 px-3 py-2 rounded-lg text-xs font-orbitron text-gray-300 border border-gray-700">
                            Lv.<span id="click-level">1</span>
                        </div>
                    </button>

                    <!-- Auto Generator Upgrade Button -->
                    <button id="upgrade-auto-btn" class="p-3 bg-gray-800 hover:bg-gray-750 disabled:opacity-40 disabled:hover:bg-gray-800 rounded-xl border border-gray-700 text-left transition flex items-center justify-between group">
                        <div>
                            <div class="text-xs font-bold text-gray-200">オート・ドローン</div>
                            <div class="text-[11px] text-gray-400">+1 エナジー/秒</div>
                            <div class="text-xs font-orbitron text-cyan-400 mt-1">コスト: <span id="auto-cost">50</span></div>
                        </div>
                        <div class="bg-gray-900 px-3 py-2 rounded-lg text-xs font-orbitron text-gray-300 border border-gray-700">
                            Lv.<span id="auto-level">0</span>
                        </div>
                    </button>

                </div>
            </div>

        </section>

        <!-- Right Panel: Leaderboard & Data Controls (5 cols) -->
        <section class="lg:col-span-5 flex flex-col gap-6">

            <!-- Global Leaderboard Card -->
            <div class="bg-gray-900/60 rounded-2xl p-5 border border-gray-800 flex-grow flex flex-col">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-sm font-bold font-orbitron text-yellow-400 flex items-center gap-2">
                        <i class="fa-solid fa-trophy"></i> ハイスコアランキング
                    </h3>
                    <span class="text-[10px] bg-gray-800 text-gray-400 px-2 py-0.5 rounded border border-gray-700">TOP 10</span>
                </div>

                <div class="overflow-y-auto max-h-[360px] pr-1 space-y-2 flex-grow" id="leaderboard-list">
                    <div class="text-center text-xs text-gray-500 py-8">ランキングを取得中...</div>
                </div>
            </div>

            <!-- Data Management (Save State / Delete Data) -->
            <div class="bg-gray-900/60 rounded-2xl p-5 border border-gray-800">
                <h3 class="text-sm font-bold font-orbitron text-gray-300 mb-3 flex items-center gap-2">
                    <i class="fa-solid fa-database text-cyan-400"></i> クラウド保存状況
                </h3>
                <p id="save-status" class="text-xs text-gray-400 mb-4">
                    ログインするとクラウドへ自動的にデータが保存されます。
                </p>
                
                <div class="flex gap-2">
                    <button id="manual-save-btn" disabled class="flex-1 bg-cyan-600/30 hover:bg-cyan-600/50 text-cyan-300 disabled:opacity-30 border border-cyan-500/30 py-2 rounded-lg text-xs font-bold transition">
                        <i class="fa-solid fa-cloud-arrow-up mr-1"></i> 手動保存
                    </button>
                    <button id="reset-data-btn" disabled class="bg-red-900/20 hover:bg-red-900/40 text-red-400 disabled:opacity-30 border border-red-500/30 px-3 py-2 rounded-lg text-xs font-bold transition">
                        <i class="fa-solid fa-trash mr-1"></i> リセット
                    </button>
                </div>
            </div>

        </section>

    </main>

    <!-- Edit Name Modal -->
    <div id="name-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-gray-900 border border-gray-800 rounded-2xl max-w-sm w-full p-6 shadow-2xl">
            <h3 class="text-base font-bold text-gray-100 font-orbitron mb-4">プレイヤー名の編集</h3>
            <input type="text" id="name-input" maxlength="15" class="w-full bg-gray-950 border border-gray-700 rounded-xl px-4 py-2.5 text-sm text-gray-100 focus:outline-none focus:border-cyan-400 mb-4" placeholder="名前を入力">
            <div class="flex justify-end gap-2">
                <button id="close-modal-btn" class="px-4 py-2 bg-gray-800 hover:bg-gray-700 text-gray-300 text-xs font-bold rounded-lg transition">キャンセル</button>
                <button id="save-name-btn" class="px-4 py-2 bg-cyan-500 hover:bg-cyan-400 text-gray-950 text-xs font-bold rounded-lg transition">保存</button>
            </div>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-5 right-5 bg-gray-800 text-cyan-300 border border-cyan-500/50 px-4 py-3 rounded-xl shadow-xl text-xs font-bold transition-all duration-300 transform translate-y-20 opacity-0 z-50 flex items-center gap-2">
        <i class="fa-solid fa-circle-check text-cyan-400"></i>
        <span id="toast-message">保存しました</span>
    </div>

    <!-- Firebase SDK Implementation -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getAuth, 
            GoogleAuthProvider, 
            signInWithPopup, 
            signOut, 
            onAuthStateChanged 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { 
            getFirestore, 
            doc, 
            getDoc, 
            setDoc, 
            deleteDoc, 
            collection, 
            onSnapshot 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyAAp88ypoypEBetx-p1Ah7P4qLls2vROGY",
            authDomain: "mapaa-a65a1.firebaseapp.com",
            projectId: "mapaa-a65a1",
            storageBucket: "mapaa-a65a1.firebasestorage.app",
            messagingSenderId: "284057359693",
            appId: "1:284057359693:web:fdb9f22edfcb776fae9304"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        // Game State Variables
        let currentUser = null;
        let displayName = "ゲスト";
        let gameState = {
            energy: 0,
            totalEnergy: 0,
            clickPower: 1,
            clickLevel: 1,
            autoPower: 0,
            autoLevel: 0,
            clickCost: 10,
            autoCost: 50
        };

        // DOM Elements
        const el = {
            loginBtn: document.getElementById('login-btn'),
            logoutBtn: document.getElementById('logout-btn'),
            authContainer: document.getElementById('auth-container'),
            loadingSpinner: document.getElementById('loading-spinner'),
            userProfile: document.getElementById('user-profile'),
            userAvatar: document.getElementById('user-avatar'),
            userName: document.getElementById('user-name'),
            editNameBtn: document.getElementById('edit-name-btn'),
            
            energyCount: document.getElementById('energy-count'),
            epsDisplay: document.getElementById('eps-display'),
            totalEnergyDisplay: document.getElementById('total-energy-display'),
            coreButton: document.getElementById('core-button'),
            clickArea: document.getElementById('click-area'),
            
            upgradeClickBtn: document.getElementById('upgrade-click-btn'),
            clickCost: document.getElementById('click-cost'),
            clickLevel: document.getElementById('click-level'),
            
            upgradeAutoBtn: document.getElementById('upgrade-auto-btn'),
            autoCost: document.getElementById('auto-cost'),
            autoLevel: document.getElementById('auto-level'),
            
            leaderboardList: document.getElementById('leaderboard-list'),
            saveStatus: document.getElementById('save-status'),
            manualSaveBtn: document.getElementById('manual-save-btn'),
            resetDataBtn: document.getElementById('reset-data-btn'),
            
            nameModal: document.getElementById('name-modal'),
            nameInput: document.getElementById('name-input'),
            saveNameBtn: document.getElementById('save-name-btn'),
            closeModalBtn: document.getElementById('close-modal-btn'),
            
            toast: document.getElementById('toast'),
            toastMessage: document.getElementById('toast-message')
        };

        // -------------------------------------------------------------
        // Toast Notification Helper
        // -------------------------------------------------------------
        function showToast(msg) {
            el.toastMessage.textContent = msg;
            el.toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                el.toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }

        // -------------------------------------------------------------
        // UI & Game Loop Updates
        // -------------------------------------------------------------
        function updateUI() {
            el.energyCount.textContent = Math.floor(gameState.energy).toLocaleString();
            el.totalEnergyDisplay.textContent = Math.floor(gameState.totalEnergy).toLocaleString();
            el.epsDisplay.textContent = gameState.autoPower;

            el.clickCost.textContent = gameState.clickCost.toLocaleString();
            el.clickLevel.textContent = gameState.clickLevel;
            
            el.autoCost.textContent = gameState.autoCost.toLocaleString();
            el.autoLevel.textContent = gameState.autoLevel;

            // Enable/Disable Upgrade Buttons based on Energy
            el.upgradeClickBtn.disabled = gameState.energy < gameState.clickCost;
            el.upgradeAutoBtn.disabled = gameState.energy < gameState.autoCost;
        }

        // Game Tick (1 second interval)
        setInterval(() => {
            if (gameState.autoPower > 0) {
                gameState.energy += gameState.autoPower;
                gameState.totalEnergy += gameState.autoPower;
                updateUI();
            }
        }, 1000);

        // Auto Save Interval (10 seconds)
        setInterval(() => {
            if (currentUser) {
                saveUserData(true);
            }
        }, 10000);

        // -------------------------------------------------------------
        // Game Actions
        // -------------------------------------------------------------
        // Tap Core Button
        el.coreButton.addEventListener('click', (e) => {
            gameState.energy += gameState.clickPower;
            gameState.totalEnergy += gameState.clickPower;
            
            // Visual Popup FX
            const pop = document.createElement('div');
            pop.className = 'click-pop';
            pop.textContent = `+${gameState.clickPower}`;
            const rect = el.clickArea.getBoundingClientRect();
            const x = e.clientX - rect.left - 10;
            const y = e.clientY - rect.top - 20;
            pop.style.left = `${x}px`;
            pop.style.top = `${y}px`;
            el.clickArea.appendChild(pop);

            setTimeout(() => pop.remove(), 800);
            updateUI();
        });

        // Upgrade Click Power
        el.upgradeClickBtn.addEventListener('click', () => {
            if (gameState.energy >= gameState.clickCost) {
                gameState.energy -= gameState.clickCost;
                gameState.clickLevel += 1;
                gameState.clickPower += 1;
                gameState.clickCost = Math.floor(gameState.clickCost * 1.5);
                updateUI();
            }
        });

        // Upgrade Auto Generator
        el.upgradeAutoBtn.addEventListener('click', () => {
            if (gameState.energy >= gameState.autoCost) {
                gameState.energy -= gameState.autoCost;
                gameState.autoLevel += 1;
                gameState.autoPower += 1;
                gameState.autoCost = Math.floor(gameState.autoCost * 1.6);
                updateUI();
            }
        });

        // -------------------------------------------------------------
        // Firestore Backend Sync Operations
        // -------------------------------------------------------------
        
        // Helper: Get Firestore path for public scores
        function getLeaderboardDocRef(uid) {
            return doc(db, 'artifacts', 'cyber-clicker', 'public', 'data', 'scores', uid);
        }

        // Save User Data to Firestore
        async function saveUserData(silent = false) {
            if (!currentUser) return;

            const payload = {
                uid: currentUser.uid,
                displayName: displayName,
                photoURL: currentUser.photoURL || '',
                gameState: gameState,
                updatedAt: Date.now()
            };

            try {
                await setDoc(getLeaderboardDocRef(currentUser.uid), payload);
                if (!silent) showToast("データを正常に保存しました！");
                el.saveStatus.textContent = `最終同期: ${new Date().toLocaleTimeString()}`;
            } catch (error) {
                console.error("Firestore Save Error:", error);
                if (!silent) showToast("保存に失敗しました。");
            }
        }

        // Load User Data from Firestore
        async function loadUserData(uid) {
            try {
                const docSnap = await getDoc(getLeaderboardDocRef(uid));
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    if (data.gameState) {
                        gameState = { ...gameState, ...data.gameState };
                    }
                    if (data.displayName) {
                        displayName = data.displayName;
                        el.userName.textContent = displayName;
                    }
                    showToast("データを読み込みました！");
                } else {
                    // New User Setup
                    await saveUserData(true);
                }
                updateUI();
            } catch (error) {
                console.error("Firestore Load Error:", error);
            }
        }

        // Delete / Reset Game Data
        async function resetUserData() {
            if (!currentUser) return;
            if (!confirm("本当に全データをリセットしますか？この操作は取り消せません。")) return;

            try {
                await deleteDoc(getLeaderboardDocRef(currentUser.uid));
                gameState = {
                    energy: 0,
                    totalEnergy: 0,
                    clickPower: 1,
                    clickLevel: 1,
                    autoPower: 0,
                    autoLevel: 0,
                    clickCost: 10,
                    autoCost: 50
                };
                updateUI();
                showToast("データが削除・リセットされました");
            } catch (error) {
                console.error("Reset Error:", error);
                showToast("リセットに失敗しました");
            }
        }

        // Listen for Realtime Leaderboard Updates
        function subscribeLeaderboard() {
            const scoresCollection = collection(db, 'artifacts', 'cyber-clicker', 'public', 'data', 'scores');
            
            onSnapshot(scoresCollection, (snapshot) => {
                const list = [];
                snapshot.forEach(doc => {
                    list.push(doc.data());
                });

                // Client-side Sort (Rule: No complex query indexes required)
                list.sort((a, b) => (b.gameState?.totalEnergy || 0) - (a.gameState?.totalEnergy || 0));

                renderLeaderboard(list.slice(0, 10));
            }, (error) => {
                console.error("Leaderboard Snapshot Error:", error);
                el.leaderboardList.innerHTML = `<div class="text-center text-xs text-red-400 py-4">ランキング読込エラー</div>`;
            });
        }

        // Render Leaderboard HTML
        function renderLeaderboard(topUsers) {
            if (topUsers.length === 0) {
                el.leaderboardList.innerHTML = `<div class="text-center text-xs text-gray-500 py-8">データが存在しません</div>`;
                return;
            }

            el.leaderboardList.innerHTML = topUsers.map((item, idx) => {
                const isSelf = currentUser && item.uid === currentUser.uid;
                const total = Math.floor(item.gameState?.totalEnergy || 0).toLocaleString();
                
                let rankBadge = `<span class="w-5 text-center font-orbitron font-bold text-gray-400">${idx + 1}</span>`;
                if (idx === 0) rankBadge = `<i class="fa-solid fa-crown text-yellow-400 w-5 text-center"></i>`;
                if (idx === 1) rankBadge = `<i class="fa-solid fa-medal text-gray-300 w-5 text-center"></i>`;
                if (idx === 2) rankBadge = `<i class="fa-solid fa-medal text-amber-600 w-5 text-center"></i>`;

                return `
                    <div class="flex items-center justify-between p-2.5 rounded-xl text-xs ${isSelf ? 'bg-cyan-950/60 border border-cyan-500/40' : 'bg-gray-800/40'} border border-gray-800">
                        <div class="flex items-center gap-2 overflow-hidden">
                            ${rankBadge}
                            <img src="${item.photoURL || 'https://via.placeholder.com/32'}" class="w-6 h-6 rounded-full border border-gray-700" alt="avatar" onerror="this.src='https://placehold.co/32x32/1e293b/00f0ff?text=U'">
                            <span class="font-bold truncate text-gray-200 ${isSelf ? 'text-cyan-300' : ''}">${escapeHtml(item.displayName || '名無し')}</span>
                        </div>
                        <div class="font-orbitron font-bold text-gray-300 ml-2">${total}</div>
                    </div>
                `;
            }).join('');
        }

        function escapeHtml(str) {
            return str.replace(/[&<>"']/g, function(m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
            });
        }

        // -------------------------------------------------------------
        // Authentication Logic
        // -------------------------------------------------------------
        el.loginBtn.addEventListener('click', async () => {
            try {
                await signInWithPopup(auth, provider);
            } catch (error) {
                console.error("Login Error:", error);
                showToast("ログインに失敗しました");
            }
        });

        el.logoutBtn.addEventListener('click', async () => {
            try {
                await signOut(auth);
                location.reload();
            } catch (error) {
                console.error("Logout Error:", error);
            }
        });

        // Auth Observer
        onAuthStateChanged(auth, async (user) => {
            el.loadingSpinner.classList.add('hidden');
            if (user) {
                currentUser = user;
                displayName = user.displayName || "エージェント";
                
                el.loginBtn.classList.add('hidden');
                el.userProfile.classList.remove('hidden');
                el.userAvatar.src = user.photoURL || 'https://via.placeholder.com/32';
                el.userName.textContent = displayName;
                
                el.manualSaveBtn.disabled = false;
                el.resetDataBtn.disabled = false;

                // Load User Data
                await loadUserData(user.uid);
            } else {
                currentUser = null;
                el.loginBtn.classList.remove('hidden');
                el.userProfile.classList.add('hidden');
                el.saveStatus.textContent = "※ ゲストモード（進行状況は保持されません）";
            }
        });

        // -------------------------------------------------------------
        // Profile Name Editing
        // -------------------------------------------------------------
        el.editNameBtn.addEventListener('click', () => {
            el.nameInput.value = displayName;
            el.nameModal.classList.remove('hidden');
        });

        el.closeModalBtn.addEventListener('click', () => {
            el.nameModal.classList.add('hidden');
        });

        el.saveNameBtn.addEventListener('click', async () => {
            const newName = el.nameInput.value.trim();
            if (newName && currentUser) {
                displayName = newName;
                el.userName.textContent = displayName;
                el.nameModal.classList.add('hidden');
                await saveUserData();
            }
        });

        // Manual Save / Reset Buttons Event Listeners
        el.manualSaveBtn.addEventListener('click', () => saveUserData(false));
        el.resetDataBtn.addEventListener('click', resetUserData);

        // Initial Load
        updateUI();
        subscribeLeaderboard();
    </script>
</body>
</html>
